server.port=8080

# Persistent file-based H2 Database (Windows-ready without MySQL installation)
spring.datasource.url=jdbc:h2:file:./data/blueline_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for academic verification
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & CORS configuration
blueline.jwt.secret=${SESSION_SECRET:}
blueline.admin.passcode=${ADMIN_PASSCODE:}
blueline.cors.allowed-origins=http://localhost:5173,http://localhost:3000
